server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy: /api/* -> backend API (strips the /api prefix), so the browser
    # talks to a single origin (no CORS needed in production).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off; # Docker embedded DNS: re-resolve the api container
        set $api_upstream api:8080;
        rewrite ^/api/(.*)$ /$1 break; # strip the /api prefix
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
